  <meta name="description" content="Vidyra downloads videos and audio from YouTube and hundreds of other sites in any quality and format, with a download queue, library and built-in player.">

  <link rel="stylesheet" href="/css/splash.css">
  <script>
    // Apply the saved theme and accent before first paint, so the page never flashes the wrong look.
    // Keep the names in step with THEMES and ACCENTS in js/core.js.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('vidyra.prefs') || '{}');
        var root = document.documentElement;
        var light = ['paper', 'cloud', 'cream', 'mint-light', 'sky-light', 'lavender', 'blush', 'sand-light'];
        var legacy = { dark: 'night', light: 'paper' };
        var theme = legacy[p.theme] || p.theme || 'system';
        if (theme === 'system') {
          var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
          theme = dark ? 'night' : 'paper';
        }
        root.setAttribute('data-theme-name', theme);
        root.setAttribute('data-theme', light.indexOf(theme) >= 0 ? 'light' : 'dark');
        root.setAttribute('data-motion', p.motion === false ? 'off' : 'on');
        var accents = {
          gold: ['#FFC61A', '#FF9F1A'], coral: ['#FF6F61', '#FFB067'], mint: ['#34D399', '#2DD4BF'], lilac: ['#B497FF', '#F0ABFC'],
          ocean: ['#3B82F6', '#06B6D4'], ember: ['#FF5A1F', '#FFB300'], lime: ['#A3E635', '#22C55E'], rose: ['#F43F5E', '#FB7185'],
          sky: ['#38BDF8', '#60A5FA'], sand: ['#D6B37A', '#F5D9A8'], ice: ['#A5F3FC', '#E0F2FE'], plum: ['#9333EA', '#C026D3'],
          indigo: ['#3B82F6', '#06B6D4'], emerald: ['#34D399', '#2DD4BF'], amber: ['#FFC61A', '#FF9F1A'], violet: ['#B497FF', '#F0ABFC'], teal: ['#34D399', '#2DD4BF']
        };
        var a = accents[p.accent];
        if (a) {
          root.style.setProperty('--accent', a[0]);
          root.style.setProperty('--accent-2', a[1]);
        }
      } catch (e) { /* storage blocked: defaults apply */ }
    })();
  </script>
</head>
